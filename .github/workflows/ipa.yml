name: Download Brawl Stars IPA

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "ipatool-Stand: main, ein Tag oder refs/pull/507/head"
        required: true
        default: "main"
      auth_code:
        description: "2FA-Code (nur eintragen, wenn Apple einen verlangt)"
        required: false
        default: ""
      version_id:
        description: "external-version-id (leer = aktuelle Version)"
        required: false
        default: ""
      bundle_id:
        description: "Bundle-ID der App"
        required: true
        default: "com.supercell.laser"

permissions:
  contents: read

jobs:
  download:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      AUTH_CODE: ${{ inputs.auth_code }}
      VERSION_ID: ${{ inputs.version_id }}
      BUNDLE_ID: ${{ inputs.bundle_id }}
    steps:
      - name: Secrets pruefen
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ]; then
            echo "Secrets APPLE_ID und APPLE_PASSWORD fehlen."
            exit 1
          fi

      - name: ipatool-Quellcode holen
        uses: actions/checkout@v4
        with:
          repository: majd/ipatool
          ref: ${{ inputs.git_ref }}
          path: src

      - name: Go einrichten
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: ipatool bauen
        run: |
          set -euo pipefail
          cd src
          echo "Commit: $(git log -1 --oneline)"
          CGO_ENABLED=1 go build -o "$GITHUB_WORKSPACE/ipatool" .
          cd "$GITHUB_WORKSPACE"
          ./ipatool --version

      - name: Login bei Apple
        run: |
          set -uo pipefail
          if [ -n "$AUTH_CODE" ]; then
            ./ipatool auth login --email "$APPLE_ID" --password "$APPLE_PASSWORD" \
              --auth-code "$AUTH_CODE" --non-interactive 2>&1 | tee /tmp/login.log
          else
            ./ipatool auth login --email "$APPLE_ID" --password "$APPLE_PASSWORD" \
              --non-interactive 2>&1 | tee /tmp/login.log
          fi
          RC=${PIPESTATUS[0]}
          if [ "$RC" -ne 0 ]; then
            if grep -qiE "2fa|auth.?code|two.?factor|verification" /tmp/login.log; then
              echo "Apple verlangt einen 2FA-Code. Starte den Workflow erneut und trage ihn bei auth_code ein."
            else
              echo "Login abgelehnt, und es ist KEIN 2FA-Hinweis. Wahrscheinlich passt der Endpunkt oder die Signatur nicht zu diesem ipatool-Stand."
            fi
            exit "$RC"
          fi

      - name: App zum Account hinzufuegen
        continue-on-error: true
        run: ./ipatool purchase --bundle-identifier "$BUNDLE_ID" --non-interactive

      - name: Verfuegbare Versionen auflisten
        continue-on-error: true
        run: ./ipatool list-versions --bundle-identifier "$BUNDLE_ID" --non-interactive

      - name: IPA herunterladen
        run: |
          set -euo pipefail
          mkdir -p out
          if [ -n "$VERSION_ID" ]; then
            ./ipatool download --bundle-identifier "$BUNDLE_ID" \
              --external-version-id "$VERSION_ID" -o out/brawlstars.ipa --non-interactive
          else
            ./ipatool download --bundle-identifier "$BUNDLE_ID" \
              -o out/brawlstars.ipa --non-interactive
          fi
          ls -l out

      - name: Version der IPA anzeigen
        run: |
          set -euo pipefail
          unzip -p out/brawlstars.ipa 'Payload/*.app/Info.plist' > /tmp/Info.plist
          echo "Version:   $(plutil -extract CFBundleShortVersionString raw -o - /tmp/Info.plist)"
          echo "Build:     $(plutil -extract CFBundleVersion raw -o - /tmp/Info.plist)"
          echo "Bundle-ID: $(plutil -extract CFBundleIdentifier raw -o - /tmp/Info.plist)"

      - name: IPA als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: brawlstars-ipa
          path: out/brawlstars.ipa
          retention-days: 1
          if-no-files-found: error

      - name: Apple-Session beenden
        if: always()
        continue-on-error: true
        run: ./ipatool auth revoke --non-interactive
